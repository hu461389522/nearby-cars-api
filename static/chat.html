<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 智能客服</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        h2 { color: #333; }
        #chatBox { border: 1px solid #ddd; border-radius: 8px; height: 400px; overflow-y: auto; padding: 15px; margin-bottom: 15px; background: #f9f9f9; }
        .msg { margin: 10px 0; padding: 10px 14px; border-radius: 10px; max-width: 80%; }
        .user { background: #007bff; color: white; margin-left: auto; text-align: right; }
        .ai { background: #e9ecef; color: #333; }
        #inputArea { display: flex; gap: 10px; }
        #question { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
        #sendBtn { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
        #sendBtn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h2>🤖 AI 智能客服</h2>
    <div id="chatBox"></div>
    <div id="inputArea">
        <input type="text" id="question" placeholder="请输入您的问题..." />
        <button id="sendBtn" onclick="sendQuestion()">发送</button>
    </div>

    <script>
        async function sendQuestion() {
            const input = document.getElementById('question');
            const question = input.value.trim();
            if (!question) return;

            const chatBox = document.getElementById('chatBox');

            // 显示用户问题
            chatBox.innerHTML += `<div class="msg user">${question}</div>`;
            input.value = '';

            // 显示"思考中"
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="msg ai" id="${loadingId}">思考中...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });
                const data = await res.json();
                document.getElementById(loadingId).innerText = data.data.answer;
            } catch (e) {
                document.getElementById(loadingId).innerText = '出错了，请稍后再试。';
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 回车发送
        document.getElementById('question').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendQuestion();
        });
    </script>
</body>
</html>
